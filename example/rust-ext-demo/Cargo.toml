[package]
name = "rsphp-ext-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
bstr = "1.13.1"
rsphp = { path = "../../", features = [ "bstr" ] }
rsphp-macros-c = { path = "../../crates/macros-c" }
rsphp-macros-rs = { path = "../../crates/macros-rs" }
rsphp-sys = { path = "../../crates/sys" }

[build-dependencies]
rsphp-stub-parser = { path = "../../crates/stub-parser" }
rsphp-sys = { path = "../../crates/sys" }

# Not part of the rsphp workspace, can't integrate with the standard example
# system because we need a build script
[workspace]

[lib]
crate-type = ["cdylib"]

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# `restriction` category lints
allow_attributes = "warn"
as_pointer_underscore = "warn"
as_underscore = "warn"
assertions_on_result_states = "warn"
default_union_representation = "warn"
doc_paragraphs_missing_punctuation = "warn"
inline_trait_bounds = "warn"
missing_assert_message = "warn"
missing_asserts_for_indexing = "warn"
non_ascii_literal = "warn"
non_zero_suggestions = "warn"
panic_in_result_fn = "warn"
pattern_type_mismatch = "warn"
shadow_same = "warn"
single_char_lifetime_names = "warn"
unwrap_in_result = "warn"

# `nursery` category lints
equatable_if_let = "warn"
needless_type_cast = "warn"
nonstandard_macro_braces = "warn"
